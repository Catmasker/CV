name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended texlive-lang-chinese

      - name: Build CV PDF
        run: pdflatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Rename PDF to cv.pdf
        run: cp main.pdf cv.pdf

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: cv.pdf
          body: |
            ## CV Release v${{ github.run_number }}

            ### Attachments
            - `cv.pdf` — compiled CV document

            ### How to build locally
            - **Docker**: `docker compose run --rm cv-builder`
            - **Local**: Compile `main.tex` with pdflatex
          draft: false
          prerelease: false
