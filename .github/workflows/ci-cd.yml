name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # CI: verify the project structure is correct
  check-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check required files exist
        run: |
          echo "Checking project structure..."
          test -f main.tex && echo "✅ main.tex found"
          test -f Dockerfile && echo "✅ Dockerfile found"
          test -f docker-compose.yml && echo "✅ docker-compose.yml found"

  # CD: create a release when pushing to main
  release:
    if: github.event_name == 'push'
    needs: check-files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## CV Release v${{ github.run_number }}

            ### How to build
            - **Docker**: `docker compose run --rm cv-builder`
            - **Local**: Compile `main.tex` with xelatex or pdflatex
          draft: false
          prerelease: false
