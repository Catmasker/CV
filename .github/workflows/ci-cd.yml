name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: docker compose build

      - name: Compile CV PDF
        run: docker compose run --rm cv-builder

      - name: Rename PDF to cv.pdf
        run: cp main.pdf cv.pdf

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: cv.pdf
          body: |
            ## CV Release v${{ github.run_number }}

            ### Attachments
            - `cv.pdf` — compiled CV document

            ### How to build locally
            - **Docker**: `docker compose run --rm cv-builder`
          draft: false
          prerelease: false
